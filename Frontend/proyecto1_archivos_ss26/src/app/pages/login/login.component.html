<div class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <form class="card p-4 shadow-sm" style="width: 340px;" [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <h1 class="h4 text-center mb-1">Mini ERP</h1>
        <p class="text-center text-muted mb-3">Inicia sesion para continuar</p>

        <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input id="username" type="text" class="form-control" formControlName="username" autocomplete="username" />
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input id="password" type="password" class="form-control" formControlName="password"
                autocomplete="current-password" />
        </div>

        @if (errorLogin()) {
        <div class="alert alert-danger py-2 small" role="alert">
            Usuario o contraseña incorrectos.
        </div>
        }

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>

        <p class="text-center text-muted small mt-3 mb-0">
            Usuarios de prueba: admin1 / compras1 / inventario1 / ventas1 (cualquier contraseña).
        </p>
    </form>
</div>
